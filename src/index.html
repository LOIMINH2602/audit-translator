<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phiên Dịch Audit</title>
<meta name="theme-color" content="#0B6E5F">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://translate.googleapis.com" crossorigin>
<link rel="stylesheet" href="css/app.css?v=2026-11-01.5">
</head>
<body>
<header>
  <h1>Phiên Dịch Audit</h1>
  <p class="sub">Nghe người nói và hiện bản dịch tiếng Việt.</p>
</header>
<main>
  <div class="warn" id="warn" hidden></div>

  <section class="panel">
    <span class="label">Người đang nói dùng tiếng gì?</span>
    <div class="langs" id="langs">
      <button data-lang="ko-KR">Hàn</button>
      <button data-lang="ja-JP">Nhật</button>
      <button data-lang="zh-CN">Trung</button>
      <button data-lang="en-US">Anh</button>
    </div>
    <button class="toggle" id="toggle" disabled>Đang nạp…</button>
    <div class="status" id="status">Chọn tiếng rồi bấm Bắt đầu nghe</div>
  </section>

  <section class="panel live" aria-live="polite">
    <div class="live-vi" id="liveVi">Bản dịch tiếng Việt sẽ hiện ở đây.</div>
    <div class="live-src" id="liveSrc"></div>
  </section>

  <section class="panel">
    <div class="row">
      <span class="label">Đã dịch (mới nhất trên đầu)</span>
      <span>
        <button class="small" id="copy" disabled>Sao chép</button>
        <button class="small" id="clear">Xoá</button>
      </span>
    </div>
    <div id="history"></div>
  </section>

  <details class="panel">
    <summary>Chẩn đoán (gửi cho người hỗ trợ khi app lỗi)</summary>
    <button class="small" id="copyLog">Sao chép nhật ký</button>
    <pre id="log"></pre>
  </details>

  <p class="foot" id="version"></p>
</main>
<script type="module" src="js/app.js?v=2026-11-01.5"></script>
<script>
  // mã app không nạp được (mạng hoặc vừa cập nhật) → báo thay vì đứng im
  setTimeout(function () {
    if (window.__appReady) return;
    var w = document.getElementById('warn');
    w.textContent = 'App chưa nạp xong. Kiểm tra mạng, đóng hẳn app rồi mở lại.';
    w.hidden = false;
  }, 8000);
</script>
</body>
</html>
